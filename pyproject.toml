[project]
name = "phasewall"
version = "0.1.0"
description = "Phases of simulated hydrodynamic systems from the walls between them in parameter space"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ludovic Dumoulin" }]
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pandas", "h5py", "matplotlib"]

[project.urls]
Repository = "https://github.com/Lu-Dumoulin/PhaseWall"

[project.scripts]
phasewall = "phasewall.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
nn = ["torch>=2.4"]
baselines = ["scikit-learn>=1.4"]     # blind grouping and logistic probe, for comparisons
app = ["marimo", "torch>=2.4", "scikit-learn>=1.4"]   # the notebook interface (apps/), with nn and baselines

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
